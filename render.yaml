services:
  - type: web
    name: cofre-digital-api
    runtime: node
    plan: free
    buildCommand: cd backend && npm ci && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cofre-digital-db
          property: connectionString

databases:
  - name: cofre-digital-db
    databaseName: cofre_digital
    user: cofre_digital_user
    plan: free
    ipAllowList: []
